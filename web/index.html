<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vida de Jesús · Mapa interactivo</title>
<style>
  :root{
    --parch:#efe6cf; --parch2:#e7dbbe; --panel:#f3ead3; --ink:#2e2212;
    --sepia:#5a3c18; --gold:#b8923a; --gold2:#e0b64e; --navy:#0d1b2a;
    --line:#cdbd97; --muted:#8a744e;
    --sbw:300px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--parch2); color:var(--ink);
    font-family:"Georgia","Times New Roman",serif;
    height:100vh; overflow:hidden; -webkit-text-size-adjust:100%;
  }
  .app{ display:flex; height:100%; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:var(--sbw); flex:0 0 var(--sbw); background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    z-index:40; box-shadow:2px 0 14px rgba(60,40,15,.12);
  }
  .sb-head{ padding:16px 18px 12px; border-bottom:1px solid var(--line) }
  .sb-head h1{ margin:0; font-size:23px; color:var(--sepia); letter-spacing:.3px }
  .sb-head p{ margin:3px 0 0; font-style:italic; font-size:13px; color:var(--muted) }
  .search{ padding:12px 14px 8px }
  .search input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
    background:#fbf5e4; font-family:inherit; font-size:14px; color:var(--ink);
  }
  .search input:focus{ outline:2px solid var(--gold); outline-offset:1px }
  .list{ flex:1; overflow-y:auto; padding:4px 8px 10px }
  .item{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 11px; border:0; background:transparent; border-radius:9px;
    cursor:pointer; font-family:inherit; color:var(--ink); transition:background .13s;
  }
  .item:hover{ background:rgba(184,146,58,.13) }
  .item.active{ background:rgba(184,146,58,.22) }
  .item .b{
    flex:0 0 26px; height:26px; border-radius:50%; background:var(--navy);
    color:#f4ecd8; display:grid; place-items:center; font-size:13px; font-weight:700;
    border:1.5px solid var(--gold);
  }
  .item .t{ font-size:15px; line-height:1.15 }
  .item .t small{ display:block; color:var(--muted); font-size:11.5px; font-style:italic }
  .item.hidden{ display:none }
  .list-sep{ padding:13px 14px 5px; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); border-top:1px solid var(--line); margin-top:6px }
  .item.sec .b{ background:transparent; border:0; flex-basis:26px }
  .item.sec .b::before{ content:''; width:11px; height:11px; border-radius:50%;
    background:var(--navy); border:1.5px solid var(--gold) }
  .item.sec .t{ font-size:14px }
  .sb-foot{ padding:10px 14px; border-top:1px solid var(--line);
    font-size:11.5px; color:var(--muted); font-style:italic; text-align:center }

  /* ---------- stage / map ---------- */
  .stage{ position:relative; flex:1; overflow:hidden; background:var(--parch2);
    touch-action:none; }
  .viewport{ position:absolute; inset:0; overflow:hidden; cursor:grab }
  .viewport.grabbing{ cursor:grabbing }
  .canvas{ position:absolute; top:0; left:0; width:1000px; height:1300px;
    transform-origin:0 0; will-change:transform; --z:1 }
  .canvas img{ position:absolute; inset:0; width:100%; height:100%;
    display:block; -webkit-user-drag:none; user-select:none }
  .route{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
    overflow:visible }
  /* rutas: líneas finas de grosor CONSTANTE (no escalan) con halo sutil.
     Estilo del mapa de referencia: guion parejo, extremos redondos. */
  .rt-halo{ fill:none; stroke:#f4ecd8; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round;
    opacity:.55; vector-effect:non-scaling-stroke }
  .rt-line{ fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; transition:stroke-width .2s }
  /* itinerario narrativo (recorrido de la vida) */
  .itin .rt-line{ stroke:var(--gold); stroke-dasharray:1 4.5 }         /* punteado fino dorado */
  .itin.on .rt-line{ stroke:var(--gold2); stroke-width:2.4; stroke-dasharray:none }
  .itin.on .rt-halo{ opacity:.8 }
  /* rutas históricas (toggle) */
  .histroute{ opacity:0; transition:opacity .25s; pointer-events:none }
  .histroute.on{ opacity:1 }
  .histroute .rt-line{ stroke-dasharray:7 5 }                          /* guion parejo */
  .histroute.solid .rt-line{ stroke-dasharray:none; stroke-width:1.2 } /* calzadas: sólido fino */
  .histroute.solid .rt-halo{ opacity:.4 }
  .histroute.camino .rt-line{ opacity:.85 }
  /* control de rutas en el sidebar */
  .routes-ctrl{ padding:8px 14px 4px }
  .rc-title{ font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:6px }
  .rc-group{ margin-bottom:9px }
  .rc-grouptitle{ font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:0 0 5px }
  .rc-chips{ display:flex; flex-wrap:wrap; gap:6px }
  .rc-chip{ display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:12.5px;
    color:var(--ink); background:#fbf5e4; border:1px solid var(--line); border-radius:999px;
    padding:5px 11px 5px 8px; cursor:pointer }
  .rc-chip i{ width:11px; height:11px; border-radius:50%; display:inline-block; opacity:.45 }
  .rc-chip.on{ border-color:var(--gold); background:#fff }
  .rc-chip.on i{ opacity:1 }
  #filterChips .rc-chip{ padding:5px 12px }        /* filtros: sin punto de color */

  .hot{ position:absolute; transform:translate(-50%,-50%); cursor:pointer;
    border:0; padding:0; background:transparent; }
  .pin{ position:relative; display:grid; place-items:center;
    transform:scale(calc(1 / var(--z))); transform-origin:center; }
  .pin .ring{ position:absolute; width:34px; height:34px; border-radius:50%;
    border:2px solid var(--gold); animation:pulse 2.4s ease-out infinite }
  .pin .dot{ position:relative; width:24px; height:24px; border-radius:50%;
    background:var(--navy); color:#f4ecd8; display:grid; place-items:center;
    font-size:13px; font-weight:700; border:2px solid var(--gold);
    box-shadow:0 2px 6px rgba(0,0,0,.4); transition:transform .13s }
  .hot:hover .pin .dot,.hot.active .pin .dot{ transform:scale(1.18) }
  .hot.active .pin .ring{ border-color:var(--gold2); border-width:3px }
  @keyframes pulse{ 0%{transform:scale(.7);opacity:.85} 70%{transform:scale(1.3);opacity:0} 100%{opacity:0} }
  @media (prefers-reduced-motion:reduce){ .pin .ring{ animation:none } }

  /* ciudades secundarias: punto pequeño + etiqueta */
  .hot.sec .pin{ display:flex; align-items:center; gap:4px }
  .hot.sec .sdot{ width:10px; height:10px; border-radius:50%; background:var(--navy);
    border:1.5px solid var(--gold); box-shadow:0 1px 3px rgba(0,0,0,.4); transition:transform .13s }
  .hot.sec:hover .sdot{ transform:scale(1.3) }
  .hot.sec.active .sdot{ background:var(--gold2); transform:scale(1.3) }
  .hot.sec .slabel{ font-size:11px; font-style:italic; color:#3a2c16; white-space:nowrap;
    text-shadow:0 0 3px #efe6cf,0 0 3px #efe6cf,0 0 2px #efe6cf; pointer-events:none; opacity:0;
    transition:opacity .2s }
  .canvas.labels .hot.sec .slabel{ opacity:1 }

  /* ---------- controles flotantes ---------- */
  .ctrls{ position:absolute; top:14px; right:14px; display:flex; flex-direction:column;
    gap:6px; z-index:30 }
  .ctrls button{ width:40px; height:40px; border:1px solid var(--line);
    background:rgba(251,245,228,.94); color:var(--sepia); font-size:20px; cursor:pointer;
    border-radius:9px; display:grid; place-items:center; box-shadow:0 3px 9px rgba(50,32,10,.18);
    font-family:inherit; line-height:1 }
  .ctrls button:hover{ background:#fff; border-color:var(--gold) }
  .ctrls button:active{ transform:translateY(1px) }

  .menu-btn{ position:absolute; top:14px; left:14px; z-index:30; display:none;
    width:42px; height:42px; border:1px solid var(--line); border-radius:9px;
    background:rgba(251,245,228,.94); color:var(--sepia); font-size:20px; cursor:pointer;
    box-shadow:0 3px 9px rgba(50,32,10,.18) }

  /* ---------- recorrido guiado ---------- */
  .tour{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; z-index:30;
    background:rgba(251,245,228,.95); border:1px solid var(--gold); border-radius:999px;
    padding:6px 8px; box-shadow:0 6px 18px rgba(50,32,10,.24) }
  .tour button{ border:0; background:var(--navy); color:#f4ecd8; width:38px; height:38px;
    border-radius:50%; cursor:pointer; font-size:18px; display:grid; place-items:center;
    font-family:inherit }
  .tour button:hover{ background:#1a2f45 }
  .tour button:disabled{ opacity:.35; cursor:default }
  .tour .lbl{ font-size:13.5px; color:var(--sepia); min-width:118px; text-align:center;
    font-variant-numeric:tabular-nums }
  .tour .lbl b{ display:block; font-size:14.5px }

  /* ---------- tarjeta de detalle ---------- */
  .card{ position:absolute; left:16px; bottom:16px; z-index:35; width:min(320px,calc(100% - 32px));
    background:linear-gradient(180deg,#fbf5e4,#f1e6cb); border:1px solid var(--gold);
    border-radius:12px; padding:15px 16px 14px; box-shadow:0 14px 32px rgba(50,32,10,.34);
    transform:translateY(14px); opacity:0; visibility:hidden; transition:.18s }
  .card.show{ transform:none; opacity:1; visibility:visible }
  .card .num{ display:inline-block; min-width:24px; height:24px; line-height:24px;
    text-align:center; background:var(--navy); color:#f4ecd8; border-radius:50%;
    font-size:13px; font-weight:700; margin-right:9px; border:1px solid var(--gold) }
  .card h3{ display:inline; font-size:19px; color:var(--sepia); margin:0 }
  .card p{ margin:10px 0 0; font-size:15px; line-height:1.48 }
  .card .refs{ margin-top:10px; font-style:italic; font-size:12.5px; color:var(--muted);
    border-top:1px dashed var(--line); padding-top:8px }
  .card .x{ position:absolute; top:8px; right:11px; border:0; background:transparent;
    font-size:20px; color:var(--muted); cursor:pointer; line-height:1 }
  .card .clink{ display:none; margin-top:12px; text-align:center; text-decoration:none;
    background:var(--navy); color:#f4ecd8; padding:9px 12px; border-radius:8px; font-size:14px;
    border:1px solid var(--gold) }
  .card .clink:hover{ background:#1a2f45 }

  .scrim{ position:absolute; inset:0; background:rgba(30,20,8,.35); z-index:39;
    opacity:0; visibility:hidden; transition:.2s }

  @media (max-width:820px){
    .sidebar{ position:absolute; inset:0 auto 0 0; transform:translateX(-100%);
      transition:transform .22s; }
    .sidebar.open{ transform:none }
    .menu-btn{ display:grid; place-items:center }
    .scrim.show{ opacity:1; visibility:visible }
    .ctrls{ top:auto; bottom:74px }
  }
</style>
</head>
<body>
<div class="app">
  <!-- barra lateral: índice + búsqueda -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <h1>Vida de Jesús</h1>
      <p>Galilea, Samaria y Judea</p>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Buscar lugar…" autocomplete="off" aria-label="Buscar lugar">
    </div>
    <div class="routes-ctrl" id="filterCtrl">
      <div class="rc-title">Filtrar por etapa</div>
      <div class="rc-chips" id="filterChips"></div>
    </div>
    <div class="routes-ctrl" id="routesCtrl">
      <div class="rc-title">Rutas históricas</div>
      <div id="rcGroups"></div>
    </div>
    <div class="list" id="list"></div>
    <div class="sb-foot">Grabado sobre relieve real (SRTM)</div>
  </aside>

  <!-- escenario del mapa -->
  <div class="stage">
    <button class="menu-btn" id="menuBtn" aria-label="Índice">☰</button>

    <div class="viewport" id="viewport">
      <div class="canvas" id="canvas">
        <img id="map" src="assets/mapa.jpg" alt="Mapa de la Vida de Jesús — Tierra Santa">
        <svg class="route" id="route" viewBox="0 0 100 130" preserveAspectRatio="none" aria-hidden="true"></svg>
        <!-- rutas de terreno inyectadas por JS -->

        <!-- marcadores inyectados por JS -->
      </div>
    </div>

    <div class="ctrls">
      <button id="zin"  aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zfit" aria-label="Ver todo" title="Ver todo">⤢</button>
    </div>

    <div class="tour" role="group" aria-label="Recorrido guiado">
      <button id="prev" aria-label="Anterior">‹</button>
      <div class="lbl" id="tourLbl"><b>Recorrido</b><span id="tourPos">Toca ▶ o un punto</span></div>
      <button id="next" aria-label="Siguiente">›</button>
    </div>

    <div class="card" id="card" role="dialog" aria-live="polite">
      <button class="x" id="close" aria-label="Cerrar">×</button>
      <span class="num" id="c-num"></span><h3 id="c-name"></h3>
      <p id="c-note"></p>
      <div class="refs" id="c-refs"></div>
      <a class="clink" id="c-link" href="#">Entrar a la ciudad →</a>
    </div>

    <div class="scrim" id="scrim"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="routes.js"></script>
<script>
(function(){
  "use strict";
  const ALL = (window.PLACES||[]);
  const P   = ALL.filter(p=>p.tier!=='secondary').slice().sort((a,b)=>a.n-b.n);
  const SEC = ALL.filter(p=>p.tier==='secondary');
  const ASPECT = 1300/1000;                       // alto/ancho del lienzo
  const vp = document.getElementById('viewport');
  const canvas = document.getElementById('canvas');
  const routeSvg = document.getElementById('route');
  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  const card = document.getElementById('card');
  const cNum=document.getElementById('c-num'), cName=document.getElementById('c-name');
  const cNote=document.getElementById('c-note'), cRefs=document.getElementById('c-refs');
  const tourPos=document.getElementById('tourPos');
  const sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');

  const CW=1000, CH=1300;
  let scale=1, tx=0, ty=0, minScale=0.2, maxScale=5;
  let current=-1;                                 // índice activo en P
  const hots=[];

  // ---------- marcadores + itinerario ----------
  P.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='hot'; b.style.left=p.x+'%'; b.style.top=p.y+'%';
    b.setAttribute('aria-label',p.name);
    b.innerHTML='<span class="pin"><span class="ring"></span><span class="dot">'+p.n+'</span></span>';
    b.addEventListener('click',e=>{ e.stopPropagation(); select(i,true); });
    canvas.appendChild(b); hots.push(b);
  });
  // marcadores secundarios (punto pequeño + etiqueta)
  const secEls=[];
  SEC.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='hot sec'; b.style.left=p.x+'%'; b.style.top=p.y+'%';
    b.setAttribute('aria-label',p.name);
    b.innerHTML='<span class="pin"><span class="sdot"></span><span class="slabel">'+p.name+'</span></span>';
    b.addEventListener('click',e=>{ e.stopPropagation(); openSec(i,true); });
    canvas.appendChild(b); secEls.push(b);
  });
  // itinerario: rutas que siguen el terreno (least-cost sobre el DEM).
  // Si no hay routes.js, cae a líneas rectas entre puntos consecutivos.
  const ROUTES = window.ROUTES || P.slice(0,-1).map((p,i)=>(
    {a:p.name,b:P[i+1].name,pts:[[p.x,p.y],[P[i+1].x,P[i+1].y]]}));
  const SVGNS='http://www.w3.org/2000/svg';
  const legEls=[];                                   // <g class="itin"> por tramo
  // curva suave Catmull-Rom -> path SVG (puntos ya en coords del viewBox)
  function smoothD(raw){
    const p=raw.map(q=>[q[0], q[1]*ASPECT]);
    if(p.length<3) return 'M'+p.map(q=>q.join(' ')).join(' L ');
    let d='M'+p[0][0].toFixed(2)+' '+p[0][1].toFixed(2);
    for(let i=0;i<p.length-1;i++){
      const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2;
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=' C'+c1x.toFixed(2)+' '+c1y.toFixed(2)+' '+c2x.toFixed(2)+' '+c2y.toFixed(2)+
         ' '+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
    }
    return d;
  }
  function routeGroup(pts, cls, color){
    const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class',cls);
    const d=smoothD(pts);
    const halo=document.createElementNS(SVGNS,'path'); halo.setAttribute('d',d); halo.setAttribute('class','rt-halo');
    const line=document.createElementNS(SVGNS,'path'); line.setAttribute('d',d); line.setAttribute('class','rt-line');
    if(color) line.setAttribute('stroke',color);
    g.appendChild(halo); g.appendChild(line); routeSvg.appendChild(g); return g;
  }
  // 1) itinerario narrativo (un grupo por tramo, para poder resaltar en el recorrido)
  ROUTES.forEach((rt,k)=>{ const g=routeGroup(rt.pts,'itin'); g.dataset.k=k; legEls.push(g); });
  // 2) rutas históricas (ocultas hasta activarlas)
  const HIST = window.HISTROUTES || [];
  const histG = {};
  HIST.forEach(h=>{
    const cls='histroute '+(h.cat||'')+(h.style==='solid'?' solid':'');
    histG[h.id]=routeGroup(h.pts,cls,h.color); histG[h.id].dataset.route=h.id;
  });
  // leyenda agrupada por categoría
  const CATLABEL={galjer:"Galilea → Jerusalén",camino:"Calzadas romanas",
                  ministerio:"Viajes de Jesús",pablo:"Hechos · Pablo"};
  const CATORDER=["galjer","camino","ministerio","pablo"];
  const rcG=document.getElementById('rcGroups');
  if(!HIST.length){ const rc=document.getElementById('routesCtrl'); if(rc) rc.style.display='none'; }
  const byCat={}; HIST.forEach(h=>{ (byCat[h.cat]=byCat[h.cat]||[]).push(h); });
  function mkChip(label,color){ const c=document.createElement('button'); c.className='rc-chip';
    c.innerHTML='<i style="background:'+color+'"></i>'+label; return c; }
  // modo EXCLUSIVO: activar un chip apaga los demás (mapa siempre limpio)
  const routeChips=[];                                    // {chip, ids}
  function setExclusive(entry){
    const turnOn=!entry.chip.classList.contains('on');
    routeChips.forEach(e=>{ e.chip.classList.remove('on'); e.ids.forEach(id=>histG[id].classList.remove('on')); });
    if(turnOn){ entry.chip.classList.add('on'); entry.ids.forEach(id=>histG[id].classList.add('on')); }
  }
  CATORDER.forEach(cat=>{ const rs=byCat[cat]; if(!rs) return;
    const g=document.createElement('div'); g.className='rc-group';
    const t=document.createElement('div'); t.className='rc-grouptitle'; t.textContent=CATLABEL[cat]||cat; g.appendChild(t);
    const chips=document.createElement('div'); chips.className='rc-chips'; g.appendChild(chips);
    if(cat==='camino'){                                   // un toggle para toda la red
      const c=mkChip('Mostrar red', rs[0].color); const entry={chip:c, ids:rs.map(h=>h.id)};
      c.addEventListener('click',()=>setExclusive(entry)); routeChips.push(entry); chips.appendChild(c);
    } else {                                              // un chip por ruta
      rs.forEach(h=>{ const c=mkChip(h.name,h.color); const entry={chip:c, ids:[h.id]};
        c.addEventListener('click',()=>setExclusive(entry)); routeChips.push(entry); chips.appendChild(c); });
    }
    rcG.appendChild(g);
  });

  // ---------- lista lateral ----------
  P.forEach((p,i)=>{
    const it=document.createElement('button');
    it.className='item'; it.dataset.i=i;
    it.innerHTML='<span class="b">'+p.n+'</span><span class="t">'+p.name+
      '<small>'+(p.refs||'')+'</small></span>';
    it.addEventListener('click',()=>{ select(i,true); closeDrawer(); });
    listEl.appendChild(it);
  });
  if(SEC.length){
    const hd=document.createElement('div'); hd.className='list-sep';
    hd.textContent='Otras ciudades'; listEl.appendChild(hd);
    SEC.forEach((p,i)=>{
      const it=document.createElement('button');
      it.className='item sec'; it.dataset.s=i;
      it.innerHTML='<span class="b"></span><span class="t">'+p.name+
        '<small>'+(p.refs||'')+'</small></span>';
      it.addEventListener('click',()=>{ openSec(i,true); closeDrawer(); });
      listEl.appendChild(it);
    });
  }
  // ---------- filtro por etapa + búsqueda (combinados) ----------
  let curFilter='todos';
  const matchFilter=p=> curFilter==='todos' || (p.cat||'ciudad')===curFilter;
  function refresh(){
    const q=searchEl.value.trim().toLowerCase();
    P.forEach((p,i)=>{ hots[i].style.display = matchFilter(p) ? '' : 'none'; });
    SEC.forEach((p,i)=>{ secEls[i].style.display = matchFilter(p) ? '' : 'none'; });
    let secVis=0;
    [...listEl.children].forEach(it=>{
      if(it.classList.contains('list-sep')) return;
      const p = it.dataset.i!==undefined ? P[+it.dataset.i] : SEC[+it.dataset.s];
      const vis = matchFilter(p) && (!q || p.name.toLowerCase().includes(q));
      it.classList.toggle('hidden', !vis);
      if(vis && it.dataset.s!==undefined) secVis++;
    });
    const sep=listEl.querySelector('.list-sep'); if(sep) sep.style.display = secVis? '' : 'none';
  }
  searchEl.addEventListener('input',refresh);
  // chips de filtro
  const FILTERS=[['todos','Todos'],['nacimiento','Nacimiento'],['ministerio','Ministerio'],
                 ['milagro','Milagros'],['pasion','Pasión'],['ciudad','Ciudades']];
  const fChips=document.getElementById('filterChips');
  FILTERS.forEach(([k,label])=>{
    const c=document.createElement('button'); c.className='rc-chip'+(k==='todos'?' on':''); c.textContent=label;
    c.addEventListener('click',()=>{ curFilter=k;
      [...fChips.children].forEach(x=>x.classList.remove('on')); c.classList.add('on'); refresh(); });
    fChips.appendChild(c);
  });

  // ---------- transform ----------
  function clamp(){
    minScale = Math.min(vp.clientWidth/CW, vp.clientHeight/CH);
    if(scale<minScale) scale=minScale;
    if(scale>maxScale) scale=maxScale;
    const sw=CW*scale, sh=CH*scale, vw=vp.clientWidth, vh=vp.clientHeight;
    tx = sw<=vw ? (vw-sw)/2 : Math.min(0, Math.max(vw-sw, tx));
    ty = sh<=vh ? (vh-sh)/2 : Math.min(0, Math.max(vh-sh, ty));
  }
  function apply(){ clamp();
    canvas.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    canvas.style.setProperty('--z', scale);
    canvas.classList.toggle('labels', scale > minScale*1.35);  // etiquetas al acercar
  }
  function zoomAt(cx,cy,factor){
    const ns=Math.max(minScale,Math.min(maxScale,scale*factor));
    const k=ns/scale; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=ns; apply();
  }

  // vuelo suave a un punto (centrado) a un zoom objetivo
  let anim=null;
  function flyTo(p, targetScale){
    const vw=vp.clientWidth, vh=vp.clientHeight;
    const ts=Math.max(minScale,Math.min(maxScale, targetScale||Math.max(minScale*2.4,1.6)));
    const nx=p.x/100*CW, ny=p.y/100*CH;
    const ttx=vw/2-ts*nx, tty=vh/2-ts*ny;
    const s0=scale,x0=tx,y0=ty, dur=520, t0=performance.now();
    if(anim) cancelAnimationFrame(anim);
    const ease=t=>1-Math.pow(1-t,3);
    (function step(now){
      let k=Math.min(1,(now-t0)/dur); const e=ease(k);
      scale=s0+(ts-s0)*e; tx=x0+(ttx-x0)*e; ty=y0+(tty-y0)*e; apply();
      if(k<1) anim=requestAnimationFrame(step);
    })(performance.now());
  }

  // ---------- selección / tarjeta ----------
  function clearActive(){
    hots.forEach(h=>h.classList.remove('active'));
    secEls.forEach(h=>h.classList.remove('active'));
    [...listEl.children].forEach(it=>it.classList.remove('active'));
    legEls.forEach(el=>el.classList.remove('on'));
  }
  const cLink=document.getElementById('c-link');
  function fillCard(p){
    const hasN = p.n!=null;
    cNum.style.display = hasN ? '' : 'none';
    cNum.textContent = hasN ? p.n : '';
    cName.textContent=p.name; cNote.textContent=p.note||''; cRefs.textContent=p.refs||'';
    cLink.style.display = p.link ? 'block' : 'none';
    if(p.link) cLink.href = p.link;
    card.classList.add('show');
  }
  function select(i, fly){                          // lugar PRIMARIO (con recorrido)
    current=i; const p=P[i]; clearActive();
    hots[i].classList.add('active');
    const it=[...listEl.children].find(el=>+el.dataset.i===i); if(it) it.classList.add('active');
    fillCard(p);
    tourPos.textContent=(i+1)+' / '+P.length+' · '+p.name;
    document.getElementById('prev').disabled=false;
    document.getElementById('next').disabled=false;
    legEls.forEach((el,k)=>el.classList.toggle('on', k===i-1)); // resalta el tramo entrante
    if(fly) flyTo(p);
  }
  function openSec(i, fly){                          // ciudad SECUNDARIA (fuera del recorrido)
    current=-1; const p=SEC[i]; clearActive();
    secEls[i].classList.add('active');
    const it=[...listEl.children].find(el=>el.dataset.s!==undefined && +el.dataset.s===i);
    if(it) it.classList.add('active');
    fillCard(p); tourPos.textContent=p.name;
    if(fly) flyTo(p, 2.4);
  }
  function closeCard(){ card.classList.remove('show'); clearActive(); current=-1;
    tourPos.textContent='Toca ▶ o un punto'; }
  document.getElementById('close').addEventListener('click',e=>{e.stopPropagation();closeCard();});

  // ---------- recorrido guiado ----------
  document.getElementById('next').addEventListener('click',()=>{
    select(current<0?0:(current+1)%P.length, true); });
  document.getElementById('prev').addEventListener('click',()=>{
    select(current<=0?P.length-1:current-1, true); });

  // ---------- controles de zoom ----------
  document.getElementById('zin').addEventListener('click',()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1.4));
  document.getElementById('zout').addEventListener('click',()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1/1.4));
  document.getElementById('zfit').addEventListener('click',()=>{ scale=minScale; apply(); closeCard(); });

  // ---------- rueda / arrastre / pellizco ----------
  vp.addEventListener('wheel',e=>{ e.preventDefault();
    const r=vp.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.12:1/1.12);
  },{passive:false});

  let drag=null, pts2=new Map(), pinch=null;
  vp.addEventListener('pointerdown',e=>{
    vp.setPointerCapture(e.pointerId); pts2.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts2.size===1){ drag={x:e.clientX,y:e.clientY,moved:0}; vp.classList.add('grabbing'); }
    else if(pts2.size===2){ const a=[...pts2.values()];
      pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}; drag=null; }
  });
  vp.addEventListener('pointermove',e=>{
    if(!pts2.has(e.pointerId)) return;
    pts2.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch && pts2.size===2){ const a=[...pts2.values()];
      const nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const r=vp.getBoundingClientRect();
      zoomAt((a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top, nd/pinch.d);
      pinch.d=nd; return;
    }
    if(drag){ tx+=e.clientX-drag.x; ty+=e.clientY-drag.y; drag.moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
      drag.x=e.clientX; drag.y=e.clientY; apply(); }
  });
  function upPtr(e){ pts2.delete(e.pointerId); if(pts2.size<2) pinch=null;
    if(pts2.size===0){ vp.classList.remove('grabbing'); drag=null; } }
  vp.addEventListener('pointerup',upPtr); vp.addEventListener('pointercancel',upPtr);
  vp.addEventListener('click',e=>{ if(e.target===vp || e.target.id==='map'){ closeCard(); }});

  // ---------- drawer móvil ----------
  function openDrawer(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
  function closeDrawer(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('menuBtn').addEventListener('click',openDrawer);
  scrim.addEventListener('click',closeDrawer);

  window.addEventListener('resize',()=>{ apply(); });

  // ---------- init ----------
  function start(){ scale=Math.min(vp.clientWidth/CW, vp.clientHeight/CH); tx=0; ty=0; apply(); }
  if(document.getElementById('map').complete) start();
  else document.getElementById('map').addEventListener('load',start);
  start();
})();
</script>
</body>
</html>
