<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jerusalén en tiempos de Jesús</title>
<style>
  :root{
    --parch:#efe6cf; --parch2:#e7dbbe; --panel:#f3ead3; --ink:#2e2212;
    --sepia:#5a3c18; --ink2:#4a3a22; --gold:#b8923a; --gold2:#e0b64e; --navy:#0d1b2a;
    --line:#cdbd97; --muted:#8a744e; --sbw:300px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{ background:var(--parch2); color:var(--ink); font-family:"Georgia","Times New Roman",serif;
    height:100vh; overflow:hidden; -webkit-text-size-adjust:100% }
  .app{ display:flex; height:100% }

  .sidebar{ width:var(--sbw); flex:0 0 var(--sbw); background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column; z-index:40;
    box-shadow:2px 0 14px rgba(60,40,15,.12) }
  .back{ display:flex; align-items:center; gap:7px; padding:11px 16px; border:0; width:100%;
    background:transparent; font-family:inherit; font-size:13.5px; color:var(--sepia); cursor:pointer;
    border-bottom:1px solid var(--line); text-align:left; text-decoration:none }
  .back:hover{ background:rgba(184,146,58,.12) }
  .sb-head{ padding:13px 18px 11px; border-bottom:1px solid var(--line) }
  .sb-head h1{ margin:0; font-size:20px; color:var(--sepia); line-height:1.15 }
  .sb-head p{ margin:3px 0 0; font-style:italic; font-size:12.5px; color:var(--muted) }
  .tourbar{ padding:10px 14px; border-bottom:1px solid var(--line) }
  .tourbar .tt{ font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin-bottom:7px }
  .tourbar .row{ display:flex; align-items:center; gap:9px }
  .tourbar button{ border:0; background:var(--navy); color:#f4ecd8; width:34px; height:34px; border-radius:50%;
    cursor:pointer; font-size:16px; font-family:inherit }
  .tourbar button:hover{ background:#1a2f45 }
  .tourbar .lbl{ font-size:13px; color:var(--sepia); flex:1; text-align:center; font-variant-numeric:tabular-nums }
  .via-toggle{ width:100%; margin-top:9px; display:flex; align-items:center; gap:8px; justify-content:center;
    font-family:inherit; font-size:12.5px; color:var(--ink); background:#fbf5e4; border:1px solid var(--line);
    border-radius:8px; padding:7px; cursor:pointer }
  .via-toggle .vd{ width:11px; height:11px; border-radius:50%; background:#8a1f14 }
  .via-toggle.on{ border-color:#8a1f14; background:#fff; color:#8a1f14; font-weight:600 }
  .hot.via .pin .ring{ display:none }
  .hot.via .pin .dot{ width:20px; height:20px; font-size:11px; background:#8a1f14 }
  .hot.via.active .pin .dot{ transform:scale(1.3) }
  .card.via .num{ background:#8a1f14 }
  .list{ flex:1; overflow-y:auto; padding:6px 8px 10px }
  .item{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; padding:9px 11px;
    border:0; background:transparent; border-radius:9px; cursor:pointer; font-family:inherit; color:var(--ink) }
  .item:hover{ background:rgba(184,146,58,.13) }
  .item.active{ background:rgba(184,146,58,.22) }
  .item .b{ flex:0 0 24px; height:24px; border-radius:50%; background:var(--navy); color:#f4ecd8;
    display:grid; place-items:center; font-size:12px; font-weight:700; border:1.5px solid var(--gold) }
  .item.pass .b{ background:#7a2318 }
  .item .t{ font-size:14.5px; line-height:1.15 }
  .item .t small{ display:block; color:var(--muted); font-size:11px; font-style:italic }
  .item.hidden{ display:none }
  .sb-foot{ padding:9px 14px; border-top:1px solid var(--line); font-size:11px; color:var(--muted);
    font-style:italic; text-align:center }

  .stage{ position:relative; flex:1; overflow:hidden; background:var(--parch2); touch-action:none }
  .viewport{ position:absolute; inset:0; overflow:hidden; cursor:grab }
  .viewport.grabbing{ cursor:grabbing }
  .canvas{ position:absolute; top:0; left:0; width:1000px; height:1100px; transform-origin:0 0;
    will-change:transform; --z:1 }
  .canvas .citybase{ position:absolute; inset:0; width:100%; height:100% }

  .hot{ position:absolute; transform:translate(-50%,-50%); cursor:pointer; border:0; padding:0; background:transparent }
  .pin{ position:relative; display:grid; place-items:center; transform:scale(calc(1 / var(--z))); transform-origin:center }
  .pin .ring{ position:absolute; width:32px; height:32px; border-radius:50%; border:2px solid var(--gold);
    animation:pulse 2.4s ease-out infinite }
  .pin .dot{ position:relative; width:23px; height:23px; border-radius:50%; background:var(--navy); color:#f4ecd8;
    display:grid; place-items:center; font-size:12.5px; font-weight:700; border:2px solid var(--gold);
    box-shadow:0 2px 6px rgba(0,0,0,.4); transition:transform .13s }
  .hot.pass .pin .dot{ background:#7a2318 }
  .hot:hover .pin .dot,.hot.active .pin .dot{ transform:scale(1.2) }
  .hot.active .pin .ring{ border-color:var(--gold2); border-width:3px }
  .pin .plabel{ position:absolute; top:calc(100% + 3px); left:50%; transform:translateX(-50%);
    font-size:11px; font-style:italic; color:#3a2c16; white-space:nowrap;
    text-shadow:0 0 3px var(--parch),0 0 3px var(--parch); pointer-events:none }
  .pin .plabel{ transition:opacity .2s }
  .canvas:not(.zoomed) .hot:not(.pass):not(.active) .plabel{ opacity:0 }  /* sitios: rótulo al acercar */
  @keyframes pulse{ 0%{transform:scale(.7);opacity:.85} 70%{transform:scale(1.3);opacity:0} 100%{opacity:0} }
  @media (prefers-reduced-motion:reduce){ .pin .ring{ animation:none } }

  .ctrls{ position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:6px; z-index:30 }
  .ctrls button{ width:40px; height:40px; border:1px solid var(--line); background:rgba(251,245,228,.94);
    color:var(--sepia); font-size:20px; cursor:pointer; border-radius:9px; display:grid; place-items:center;
    box-shadow:0 3px 9px rgba(50,32,10,.18); font-family:inherit; line-height:1 }
  .ctrls button:hover{ background:#fff; border-color:var(--gold) }
  .menu-btn{ position:absolute; top:14px; left:14px; z-index:30; display:none; width:42px; height:42px;
    border:1px solid var(--line); border-radius:9px; background:rgba(251,245,228,.94); color:var(--sepia);
    font-size:20px; cursor:pointer; box-shadow:0 3px 9px rgba(50,32,10,.18) }

  .card{ position:absolute; left:16px; bottom:16px; z-index:35; width:min(320px,calc(100% - 32px));
    background:linear-gradient(180deg,#fbf5e4,#f1e6cb); border:1px solid var(--gold); border-radius:12px;
    padding:15px 16px 14px; box-shadow:0 14px 32px rgba(50,32,10,.34); transform:translateY(14px); opacity:0;
    visibility:hidden; transition:.18s }
  .card.show{ transform:none; opacity:1; visibility:visible }
  .card .num{ display:inline-block; min-width:24px; height:24px; line-height:24px; text-align:center;
    background:var(--navy); color:#f4ecd8; border-radius:50%; font-size:13px; font-weight:700; margin-right:9px;
    border:1px solid var(--gold) }
  .card.pass .num{ background:#7a2318 }
  .card h3{ display:inline; font-size:18px; color:var(--sepia); margin:0 }
  .card p{ margin:10px 0 0; font-size:14.5px; line-height:1.48 }
  .card .refs{ margin-top:10px; font-style:italic; font-size:12.5px; color:var(--muted);
    border-top:1px dashed var(--line); padding-top:8px }
  .card .x{ position:absolute; top:8px; right:11px; border:0; background:transparent; font-size:20px;
    color:var(--muted); cursor:pointer; line-height:1 }
  .scrim{ position:absolute; inset:0; background:rgba(30,20,8,.35); z-index:39; opacity:0; visibility:hidden; transition:.2s }

  @media (max-width:820px){
    .sidebar{ position:absolute; inset:0 auto 0 0; transform:translateX(-100%); transition:transform .22s }
    .sidebar.open{ transform:none } .menu-btn{ display:grid; place-items:center }
    .scrim.show{ opacity:1; visibility:visible } .ctrls{ top:auto; bottom:16px }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="back" href="index.html">‹ Volver al mapa de Tierra Santa</a>
    <div class="sb-head">
      <h1>Jerusalén</h1>
      <p>La ciudad en tiempos de Jesús</p>
    </div>
    <div class="tourbar">
      <div class="tt" id="tourTitle">Recorrido de la Pasión</div>
      <div class="row">
        <button id="prev" aria-label="Anterior">‹</button>
        <div class="lbl" id="tourLbl">Toca ▶ o un sitio</div>
        <button id="next" aria-label="Siguiente">›</button>
      </div>
      <button class="via-toggle" id="viaToggle"><span class="vd"></span>Vía Dolorosa · 14 estaciones</button>
    </div>
    <div class="list" id="list"></div>
    <div class="sb-foot">Plano esquemático · sitios orientativos</div>
  </aside>

  <div class="stage">
    <button class="menu-btn" id="menuBtn" aria-label="Índice">☰</button>
    <div class="viewport" id="viewport">
      <div class="canvas" id="canvas">
        <svg class="citybase" id="citybase" viewBox="0 0 1000 1100" preserveAspectRatio="none" aria-label="Plano de Jerusalén"></svg>
        <!-- marcadores inyectados por JS -->
      </div>
    </div>
    <div class="ctrls">
      <button id="zin" aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zfit" aria-label="Ver todo">⤢</button>
    </div>
    <div class="card" id="card" role="dialog" aria-live="polite">
      <button class="x" id="close" aria-label="Cerrar">×</button>
      <span class="num" id="c-num"></span><h3 id="c-name"></h3>
      <p id="c-note"></p>
      <div class="refs" id="c-refs"></div>
    </div>
    <div class="scrim" id="scrim"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const NS='http://www.w3.org/2000/svg';
  const VB={w:1000,h:1100};
  const svg=document.getElementById('citybase');
  const INK='#4a3a22', INK2='#6b5636', PARCH='#efe6cf', NAVY='#123049';

  function poly(pts){ return pts.map(p=>p.join(',')).join(' '); }
  function add(tag,attrs,parent){ const e=document.createElementNS(NS,tag);
    for(const k in attrs) e.setAttribute(k,attrs[k]); (parent||svg).appendChild(e); return e; }
  function inPoly(x,y,pg){ let c=false; for(let i=0,j=pg.length-1;i<pg.length;j=i++){
    const xi=pg[i][0],yi=pg[i][1],xj=pg[j][0],yj=pg[j][1];
    if(((yi>y)!=(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; }
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  // etiquetas: 'minor' (detalle) van a un grupo que solo aparece al acercar el zoom
  const labelsMinor=document.createElementNS(NS,'g'); labelsMinor.setAttribute('id','labelsMinor');
  function txt(x,y,s,o){ o=o||{}; add('text',{x:x,y:y,'font-size':o.size||12,fill:o.fill||INK,
    'font-style':o.style||'italic','font-family':'Georgia,serif','text-anchor':o.anchor||'middle',
    'font-weight':o.weight||'normal'}, o.minor?labelsMinor:svg).textContent=s; }

  // ===== geometría base (viewBox 1000x1100; x:O→E, y:N→S) =====
  const TEMPLE={x:640,y:250,w:246,h:336};                         // Monte del Templo (herodiano)
  const SPUR=[[624,588],[706,600],[720,772],[690,910],[660,1006],[600,908],[586,772],[600,600]]; // Ciudad de David
  const CITY=[[250,256],[384,232],[520,236],[612,254],[624,588],[600,600],[586,772],
              [300,762],[258,600],[248,392]];                     // ciudad amurallada (sin Templo)
  const OLIVES=[[904,300],[1000,342],[1000,628],[906,606],[892,452]];
  const KIDRON=[[886,262],[906,300],[906,606],[720,772],[706,600],[886,586]];
  const HINNOM=[[248,392],[258,600],[300,762],[586,772],[560,838],[300,820],[236,600],[228,430]];

  // fondo pergamino
  add('rect',{x:0,y:0,width:VB.w,height:VB.h,fill:PARCH});
  const defs=add('defs',{});
  defs.innerHTML =
    '<pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
      '<line x1="0" y1="0" x2="0" y2="7" stroke="#7a6a4a" stroke-width="0.7" opacity="0.5"/></pattern>';

  // valles (tinte + contorno suave)
  [KIDRON,HINNOM].forEach(v=>{ add('polygon',{points:poly(v),fill:'#dccda9',opacity:0.5});
    add('polygon',{points:poly(v),fill:'url(#hatch)',opacity:0.4}); });
  txt(940,470,'Valle de Cedrón',{size:12,fill:INK2}); txt(300,845,'Valle de Hinom',{size:12,fill:INK2});
  txt(566,560,'Tiropeón',{size:10,fill:INK2,anchor:'start',minor:true});

  // Monte de los Olivos (colina hachurada + olivos)
  add('polygon',{points:poly(OLIVES),fill:'#e0d2ab',stroke:INK2,'stroke-width':1.2});
  add('polygon',{points:poly(OLIVES),fill:'url(#hatch)',opacity:0.6});
  for(let i=0;i<12;i++){ const x=930+rnd()*60,y=340+rnd()*250;
    add('line',{x1:x,y1:y,x2:x,y2:y-10,stroke:'#5a3c18','stroke-width':1});
    add('circle',{cx:x,cy:y-14,r:4.5,fill:'none',stroke:'#5a3c18','stroke-width':1}); }
  txt(956,300,'Monte de los Olivos',{size:12,fill:INK,weight:'bold'});

  // ===== relleno de terreno de la ciudad (para que las calles resalten) =====
  add('polygon',{points:poly(CITY),fill:'#eaddba'});
  add('polygon',{points:poly(SPUR),fill:'#eaddba'});

  // ===== calles principales (banda clara con borde marcado) =====
  const streets=[
    'M556,258 Q596,420 628,588 Q648,800 660,1002',   // eje N-S del Tiropeón (calle principal)
    'M300,300 Q470,320 624,318',                       // decumano norte
    'M300,660 Q470,650 624,548',                       // Ciudad Alta → puente del Templo
    'M300,470 L620,470',                               // transversal media
    'M420,258 L430,762',                               // cardo de la Ciudad Alta
    'M344,392 L356,760',                               // segunda calle N-S de la Ciudad Alta
    'M300,392 L618,398',                               // transversal norte
    'M636,606 Q652,800 658,1000',                      // calle del espolón (Ciudad de David)
  ];
  streets.forEach(d=>{
    add('path',{d:d,fill:'none',stroke:'#cbb98d','stroke-width':14,'stroke-linecap':'round'});  // borde
    add('path',{d:d,fill:'none',stroke:'#f0e7d0','stroke-width':10.5,'stroke-linecap':'round'}); // calzada
  });
  // muestreo de las calles para que las manzanas no las invadan
  const streetPts=[]; { const tmp=document.createElementNS(NS,'path'); svg.appendChild(tmp);
    streets.forEach(d=>{ tmp.setAttribute('d',d); const L=tmp.getTotalLength();
      for(let l=0;l<=L;l+=6){ const p=tmp.getPointAtLength(l); streetPts.push([p.x,p.y]); } });
    svg.removeChild(tmp); }
  function onStreet(x,y){ for(let i=0;i<streetPts.length;i++){ const dx=x-streetPts[i][0],dy=y-streetPts[i][1];
    if(dx*dx+dy*dy<74) return true; } return false; }

  // ===== trama urbana: manzanas (insulae) con patio, por distrito (más finas) =====
  const blocks=add('g',{stroke:INK2,'stroke-width':0.8,fill:'#e2d3ac'});
  function fabric(x0,x1,y0,y1,step,poly1){
    for(let gy=y0; gy<y1; gy+=step){ for(let gx=x0; gx<x1; gx+=step){
      const x=gx+(rnd()-0.5)*2.4, y=gy+(rnd()-0.5)*2.4;
      if(!inPoly(x,y,poly1)) continue;
      if(x>TEMPLE.x-10 && x<TEMPLE.x+TEMPLE.w+10 && y>TEMPLE.y-10 && y<TEMPLE.y+TEMPLE.h+10) continue;
      if(onStreet(x,y)) continue;
      const w=step-3.4-rnd()*1.4, h=step-3.4-rnd()*1.4;
      add('rect',{x:x.toFixed(1),y:y.toFixed(1),width:w.toFixed(1),height:h.toFixed(1)},blocks);
      if(w>8.5&&h>8.5&&rnd()>0.22)  // patio interior
        add('rect',{x:(x+w/2-2).toFixed(1),y:(y+h/2-2).toFixed(1),width:4,height:4,
          fill:PARCH,stroke:INK2,'stroke-width':0.5},blocks);
    }}
  }
  fabric(300,624,258,432,16,CITY);       // barrio norte
  fabric(262,600,438,762,14,CITY);       // Ciudad Alta (fina y densa)
  fabric(586,724,600,1000,15,SPUR);      // Ciudad de David (espolón)
  txt(388,632,'CIUDAD ALTA',{size:12,fill:INK2,style:'normal',weight:'bold'});
  txt(648,706,'CIUDAD',{size:9,fill:INK2,style:'normal'}); txt(648,718,'DE DAVID',{size:9,fill:INK2,style:'normal'});
  txt(452,300,'Barrio Norte',{size:10,fill:INK2,minor:true});

  // ===== estanques (agua) =====
  function pool(x,y,w,h,label,ly){ add('rect',{x:x,y:y,width:w,height:h,rx:3,fill:NAVY,opacity:0.9});
    if(label) txt(x+w/2,ly||y-4,label,{size:10,fill:INK,minor:true}); }
  pool(700,232,30,18,null); pool(700,254,30,18,'Betesda',252);   // estanque doble de Betesda (N)
  pool(646,996,34,26,'Siloé',1034);                               // Siloé (S)
  pool(322,388,30,40,'E. de las Torres',384);                     // estanque de Ezequías (NO)

  // ===== Monte del Templo (plataforma + pórticos + Real Stoa + santuario) =====
  const T=TEMPLE;
  add('rect',{x:T.x,y:T.y,width:T.w,height:T.h,fill:'#ecdfbc',stroke:INK,'stroke-width':2.6});
  // pórticos: dobles líneas internas en los 4 lados
  add('rect',{x:T.x+10,y:T.y+10,width:T.w-20,height:T.h-20,fill:'none',stroke:INK,'stroke-width':1});
  // columnata (ticks) en el pórtico
  for(let i=0;i<=24;i++){ const xx=T.x+6+i*(T.w-12)/24;
    add('line',{x1:xx,y1:T.y+2,x2:xx,y2:T.y+10,stroke:INK,'stroke-width':0.8});
    add('line',{x1:xx,y1:T.y+T.h-10,x2:xx,y2:T.y+T.h-2,stroke:INK,'stroke-width':0.8}); }
  for(let i=0;i<=32;i++){ const yy=T.y+6+i*(T.h-12)/32;
    add('line',{x1:T.x+2,y1:yy,x2:T.x+10,y2:yy,stroke:INK,'stroke-width':0.8});
    add('line',{x1:T.x+T.w-10,y1:yy,x2:T.x+T.w-2,y2:yy,stroke:INK,'stroke-width':0.8}); }
  // Real Stoa (columnata reforzada en el lado sur)
  add('rect',{x:T.x+10,y:T.y+T.h-34,width:T.w-20,height:24,fill:'#e2d3ac',stroke:INK,'stroke-width':0.9});
  for(let i=0;i<=26;i++){ const xx=T.x+12+i*(T.w-24)/26;
    add('line',{x1:xx,y1:T.y+T.h-34,x2:xx,y2:T.y+T.h-10,stroke:INK,'stroke-width':0.7}); }
  // recinto interior + Santuario (con Lugar Santísimo)
  add('rect',{x:T.x+56,y:T.y+96,width:150,height:150,fill:'none',stroke:INK,'stroke-width':1});
  add('rect',{x:T.x+96,y:T.y+120,width:70,height:104,fill:PARCH,stroke:INK,'stroke-width':2});
  add('rect',{x:T.x+112,y:T.y+128,width:38,height:34,fill:'#e2d3ac',stroke:INK,'stroke-width':1.2});
  txt(T.x+T.w/2,T.y-8,'Monte del Templo',{size:13,fill:INK,weight:'bold'});

  // Fortaleza Antonia (esquina NO del Templo) con torres
  add('rect',{x:T.x-30,y:T.y-30,width:66,height:56,fill:'#e2d3ac',stroke:INK,'stroke-width':2});
  [[T.x-30,T.y-30],[T.x+30,T.y-30],[T.x-30,T.y+20],[T.x+30,T.y+20]].forEach(([tx,ty])=>
    add('rect',{x:tx-4,y:ty-4,width:10,height:10,fill:'#e2d3ac',stroke:INK,'stroke-width':1.2}));

  // Palacio de Herodes + tres torres (muro oeste de la Ciudad Alta)
  add('rect',{x:266,y:452,width:74,height:104,fill:'#e2d3ac',stroke:INK,'stroke-width':2});
  add('rect',{x:276,y:462,width:54,height:84,fill:'none',stroke:INK,'stroke-width':0.9});
  [270,296,322].forEach(tx=>add('rect',{x:tx,y:436,width:16,height:16,fill:'#e2d3ac',stroke:INK,'stroke-width':1.4}));
  txt(303,432,'Torres de Herodes',{size:9,fill:INK,minor:true});
  txt(303,566,'Palacio de Herodes',{size:9,fill:INK2,minor:true});

  // ===== más estructuras herodianas =====
  // Xystus (plaza pública junto al puente del Templo)
  add('rect',{x:556,y:452,width:44,height:36,fill:'#e6d7b2',stroke:INK,'stroke-width':1.4});
  for(let i=1;i<6;i++) add('line',{x1:556+i*44/6,y1:452,x2:556+i*44/6,y2:488,stroke:INK,'stroke-width':0.5});
  txt(578,448,'Xystus',{size:8.5,fill:INK2,minor:true});
  // Palacio asmoneo (Ciudad Alta)
  add('rect',{x:498,y:536,width:52,height:44,fill:'#e6d7b2',stroke:INK,'stroke-width':1.6});
  add('rect',{x:506,y:544,width:36,height:28,fill:'none',stroke:INK,'stroke-width':0.7});
  txt(524,532,'Palacio asmoneo',{size:8.5,fill:INK2,minor:true});
  // Teatro herodiano (hemiciclo, sur de la Ciudad Alta)
  add('path',{d:'M470,690 a46,30 0 0,1 92,0 z',fill:'#e6d7b2',stroke:INK,'stroke-width':1.4});
  for(let i=1;i<5;i++) add('path',{d:`M${516-i*9},690 a${i*9},${i*6} 0 0,1 ${i*18},0`,fill:'none',stroke:INK,'stroke-width':0.5});
  txt(516,706,'Teatro',{size:8.5,fill:INK2,minor:true});
  // Arco de Robinson (escalinata en el ángulo SO del Templo)
  add('path',{d:'M642,568 l-22,26 l10,6 l18,-24 z',fill:'#e6d7b2',stroke:INK,'stroke-width':1});
  txt(614,600,'Arco de Robinson',{size:8,fill:INK2,anchor:'end',minor:true});
  // Puertas de Hulda (acceso de peregrinos por el muro sur del Templo)
  add('rect',{x:724,y:582,width:20,height:6,fill:INK});  add('rect',{x:764,y:582,width:28,height:6,fill:INK});
  txt(756,600,'Puertas de Hulda',{size:8,fill:INK2,minor:true});

  // ===== murallas: Primer y Segundo muro (doble filo) + torres + Templo =====
  function wall(pts,closed){ const p=closed?poly(pts)+' '+pts[0].join(','):poly(pts);
    add('polyline',{points:p,fill:'none',stroke:INK,'stroke-width':6,'stroke-linejoin':'round'});
    add('polyline',{points:p,fill:'none',stroke:PARCH,'stroke-width':2.2,'stroke-linejoin':'round'});
    pts.forEach(([x,y],i)=>{ if(i%2===0) add('rect',{x:x-3.5,y:y-3.5,width:7,height:7,fill:PARCH,stroke:INK,'stroke-width':1.3}); }); }
  wall(CITY,true);
  wall([[T.x,T.y],[T.x+T.w,T.y],[T.x+T.w,T.y+T.h],[T.x,T.y+T.h],[T.x,T.y]],false); // muros del Templo
  wall(SPUR,true);                                                                  // muro del espolón

  // ===== puertas (rótulos, solo al acercar) =====
  [['P. de Gennat',252,468,'end'],['P. de los Esenios',300,776,'middle'],
   ['P. de la Fuente',664,1002,'start'],['P. de las Ovejas',720,238,'start'],
   ['P. Dorada',888,470,'start'],['P. del Valle',258,616,'end'],
   ['P. del Agua',680,760,'start']].forEach(([n,x,y,a])=>
     txt(x+(a==='end'?-6:a==='start'?6:0),y,n,{size:9,fill:INK2,anchor:a,minor:true}));

  // puente al Templo (arco de Wilson) desde la Ciudad Alta
  add('line',{x1:600,y1:470,x2:640,y2:470,stroke:INK,'stroke-width':2.4});
  add('line',{x1:600,y1:466,x2:640,y2:466,stroke:INK,'stroke-width':0.8});
  add('line',{x1:600,y1:474,x2:640,y2:474,stroke:INK,'stroke-width':0.8});
  txt(620,464,'puente de Wilson',{size:8,fill:INK2,anchor:'end',minor:true});

  // etiquetas de detalle por encima de todo (aparecen al acercar el zoom)
  svg.appendChild(labelsMinor);

  // ---------- datos de sitios ----------
  // x,y en viewBox -> %; cat: site|pass ; p = orden en el recorrido de la Pasión
  const RAW=[
    {name:"El Templo",x:770,y:410,note:"Reconstruido por Herodes sobre el de Salomón. Jesús enseñó aquí y predijo su destrucción.",refs:"Mt 24:1-2 · Jn 2:13-22",cat:"site"},
    {name:"Torre Antonia",x:632,y:250,note:"Guarnición romana junto al Templo; sede del pretorio. Pablo fue llevado aquí.",refs:"Hch 21:31-40",cat:"pass",p:3,plabel:"Antonia (Pretorio)"},
    {name:"Huerto de Getsemaní",x:912,y:474,note:"Al pie del Monte de los Olivos. Jesús oró y fue arrestado la noche de la Pasión.",refs:"Mt 26:36-56",cat:"pass",p:2},
    {name:"Monte de los Olivos",x:964,y:452,note:"Desde aquí Jesús enseñó sobre el fin y, tras resucitar, ascendió al cielo.",refs:"Hch 1:9-12",cat:"site"},
    {name:"Cenáculo",x:352,y:690,note:"La 'habitación del piso superior': la Última Cena y, después, Pentecostés.",refs:"Lc 22:12 · Hch 2:1-4",cat:"pass",p:1,plabel:"Cenáculo (Última Cena)"},
    {name:"Gólgota (Calvario)",x:250,y:230,note:"El 'lugar de la Calavera', fuera de la muralla: crucifixión y sepulcro de Jesús.",refs:"Jn 19:17-18",cat:"pass",p:4},
    {name:"Charca de Siloam",x:662,y:1008,note:"Jesús envió a lavarse aquí a un ciego, que recobró la vista.",refs:"Jn 9:1-11",cat:"site"},
    {name:"Palacio de Herodes",x:302,y:504,note:"Residencia real junto al muro oeste; posible lugar del juicio ante Pilato.",refs:"Lc 23:6-11",cat:"site"},
    {name:"Estanque de Betesda",x:716,y:242,note:"Junto a la puerta de las Ovejas; Jesús sanó a un paralítico en sábado.",refs:"Jn 5:1-9",cat:"site"},
    {name:"Ciudad de David",x:650,y:770,note:"El núcleo más antiguo de Jerusalén, en el espolón sur bajo el Templo.",refs:"2 Sm 5:6-9",cat:"site"},
  ];
  RAW.forEach(s=>{ s.px=+(s.x/VB.w*100).toFixed(2); s.py=+(s.y/VB.h*100).toFixed(2); });
  // recorrido de la Pasión (orden por p)
  const PASS=RAW.filter(s=>s.cat==='pass').sort((a,b)=>a.p-b.p);

  // ---- ruta de la Pasión dibujada en el SVG ----
  const rpts=PASS.map(s=>[s.x,s.y]);
  add('polyline',{points:poly(rpts),fill:'none',stroke:'#f4ecd8','stroke-width':4.4,
    'stroke-linecap':'round','stroke-linejoin':'round',opacity:0.7});
  add('polyline',{points:poly(rpts),fill:'none',stroke:'#7a2318','stroke-width':2.2,
    'stroke-dasharray':'2.6 2.4','stroke-linecap':'round','stroke-linejoin':'round',id:'passline'});

  // ================= interacción (pan/zoom + tarjeta + recorrido) =================
  const vp=document.getElementById('viewport'), canvas=document.getElementById('canvas');
  const listEl=document.getElementById('list'), card=document.getElementById('card');
  const cNum=document.getElementById('c-num'),cName=document.getElementById('c-name');
  const cNote=document.getElementById('c-note'),cRefs=document.getElementById('c-refs');
  const tourLbl=document.getElementById('tourLbl');
  const sidebar=document.getElementById('sidebar'),scrim=document.getElementById('scrim');
  const CW=1000,CH=1100; let scale=1,tx=0,ty=0,minScale=0.2,maxScale=6,current=-1;
  const hots=[];

  RAW.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='hot'+(s.cat==='pass'?' pass':''); b.style.left=s.px+'%'; b.style.top=s.py+'%';
    b.setAttribute('aria-label',s.name);
    const badge = s.cat==='pass' ? s.p : '·';
    b.innerHTML='<span class="pin"><span class="ring"></span><span class="dot">'+badge+'</span>'+
      '<span class="plabel">'+(s.plabel||s.name)+'</span></span>';
    b.addEventListener('click',e=>{ e.stopPropagation(); open(i,true); });
    canvas.appendChild(b); hots.push(b);
  });

  // lista lateral: recorrido (pass) arriba, resto abajo
  function addItem(s,i,pass){
    const it=document.createElement('button'); it.className='item'+(pass?' pass':''); it.dataset.i=i;
    it.innerHTML='<span class="b">'+(pass?s.p:'·')+'</span><span class="t">'+s.name+
      '<small>'+(s.refs||'')+'</small></span>';
    it.addEventListener('click',()=>{ open(i,true); closeDrawer(); }); listEl.appendChild(it);
  }
  PASS.forEach(s=>addItem(s,RAW.indexOf(s),true));
  const sep=document.createElement('div'); sep.className='item'; sep.style.cssText='pointer-events:none;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:10px';
  sep.textContent='Otros lugares'; listEl.appendChild(sep);
  RAW.filter(s=>s.cat!=='pass').forEach(s=>addItem(s,RAW.indexOf(s),false));

  // ---- Vía Dolorosa: 14 estaciones (Antonia → Gólgota) ----
  const VIA=[
    {n:1, x:632,y:256, name:"Jesús es condenado a muerte", note:"Pilato lo sentencia en el pretorio.", refs:"Jn 19:16"},
    {n:2, x:598,y:274, name:"Jesús carga con la cruz", note:"Recibe la cruz sobre sus hombros.", refs:"Jn 19:17"},
    {n:3, x:562,y:288, name:"Primera caída", note:"Cae por primera vez bajo el peso de la cruz.", refs:"Tradición"},
    {n:4, x:524,y:296, name:"Encuentra a su Madre", note:"Se cruza con María en el camino.", refs:"Tradición"},
    {n:5, x:486,y:298, name:"Simón de Cirene", note:"Obligan a Simón a ayudarle a llevar la cruz.", refs:"Mc 15:21"},
    {n:6, x:448,y:294, name:"Verónica enjuga su rostro", note:"Una mujer limpia el rostro de Jesús.", refs:"Tradición"},
    {n:7, x:412,y:286, name:"Segunda caída", note:"Cae por segunda vez.", refs:"Tradición"},
    {n:8, x:378,y:274, name:"Las mujeres de Jerusalén", note:"Consuela a las mujeres que lloran por él.", refs:"Lc 23:28"},
    {n:9, x:344,y:262, name:"Tercera caída", note:"Cae por tercera vez, cerca del Gólgota.", refs:"Tradición"},
    {n:10,x:314,y:252, name:"Despojado de sus vestiduras", note:"Le quitan las vestiduras.", refs:"Jn 19:23"},
    {n:11,x:288,y:244, name:"Clavado en la cruz", note:"Es crucificado en el Gólgota.", refs:"Lc 23:33"},
    {n:12,x:270,y:238, name:"Muere en la cruz", note:"Expira a la hora nona.", refs:"Mc 15:37"},
    {n:13,x:258,y:234, name:"Bajado de la cruz", note:"Su cuerpo es entregado a su Madre.", refs:"Jn 19:38"},
    {n:14,x:250,y:230, name:"Sepultado", note:"Puesto en un sepulcro nuevo, junto al lugar.", refs:"Jn 19:41-42"},
  ];
  VIA.forEach(s=>{ s.px=+(s.x/VB.w*100).toFixed(2); s.py=+(s.y/VB.h*100).toFixed(2); });
  // ruta en el SVG (oculta hasta activar)
  const viaG=add('g',{opacity:0,id:'viaG'});
  const vline=poly(VIA.map(s=>[s.x,s.y]));
  add('polyline',{points:vline,fill:'none',stroke:'#f4ecd8','stroke-width':3.4,
    'stroke-linecap':'round','stroke-linejoin':'round',opacity:0.7},viaG);
  add('polyline',{points:vline,fill:'none',stroke:'#8a1f14','stroke-width':1.9,
    'stroke-dasharray':'2.4 2','stroke-linecap':'round','stroke-linejoin':'round'},viaG);
  // marcadores (ocultos hasta activar)
  const viaMarks=[]; let viaCurrent=-1, viaOn=false;
  VIA.forEach((s,i)=>{ const b=document.createElement('button'); b.className='hot via'; b.style.display='none';
    b.style.left=s.px+'%'; b.style.top=s.py+'%'; b.setAttribute('aria-label',s.name);
    b.innerHTML='<span class="pin"><span class="dot">'+s.n+'</span></span>';
    b.addEventListener('click',e=>{ e.stopPropagation(); showVia(i,true); });
    canvas.appendChild(b); viaMarks.push(b); });

  function clamp(){ minScale=Math.min(vp.clientWidth/CW,vp.clientHeight/CH);
    scale=Math.max(minScale,Math.min(maxScale,scale));
    const sw=CW*scale,sh=CH*scale,vw=vp.clientWidth,vh=vp.clientHeight;
    tx=sw<=vw?(vw-sw)/2:Math.min(0,Math.max(vw-sw,tx));
    ty=sh<=vh?(vh-sh)/2:Math.min(0,Math.max(vh-sh,ty)); }
  const labelsMinorEl=document.getElementById('labelsMinor');
  function apply(){ clamp(); canvas.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    canvas.style.setProperty('--z',scale);
    // etiquetas de detalle: aparecen al acercar (la vista general respira)
    if(labelsMinorEl) labelsMinorEl.style.opacity = Math.max(0,Math.min(1,(scale-1.05)/0.55)).toFixed(2);
    canvas.classList.toggle('zoomed', scale>1.35); }
  function zoomAt(cx,cy,f){ const ns=Math.max(minScale,Math.min(maxScale,scale*f)),k=ns/scale;
    tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=ns; apply(); }
  let anim=null;
  function flyTo(s,ts){ const vw=vp.clientWidth,vh=vp.clientHeight;
    ts=Math.max(minScale,Math.min(maxScale,ts||Math.max(minScale*2.2,1.8)));
    const nx=s.px/100*CW,ny=s.py/100*CH,ttx=vw/2-ts*nx,tty=vh/2-ts*ny;
    const s0=scale,x0=tx,y0=ty,t0=performance.now(); if(anim)cancelAnimationFrame(anim);
    const ease=t=>1-Math.pow(1-t,3);
    (function step(now){ const k=Math.min(1,(now-t0)/520),e=ease(k);
      scale=s0+(ts-s0)*e; tx=x0+(ttx-x0)*e; ty=y0+(tty-y0)*e; apply();
      if(k<1)anim=requestAnimationFrame(step); })(performance.now()); }

  function open(i,fly){ current=i; const s=RAW[i];
    hots.forEach((h,j)=>h.classList.toggle('active',j===i));
    [...listEl.children].forEach(it=>it.classList.toggle('active',+it.dataset.i===i));
    card.classList.toggle('pass',s.cat==='pass');
    cNum.textContent=s.cat==='pass'?s.p:'·'; cName.textContent=s.name;
    cNote.textContent=s.note||''; cRefs.textContent=s.refs||''; card.classList.add('show');
    tourLbl.textContent = s.cat==='pass' ? ('Pasión '+s.p+' / '+PASS.length+' · '+s.name) : s.name;
    if(fly) flyTo(s); }
  function closeCard(){ card.classList.remove('show'); hots.forEach(h=>h.classList.remove('active'));
    viaMarks.forEach(m=>m.classList.remove('active'));
    [...listEl.children].forEach(it=>it.classList.remove('active')); current=-1; viaCurrent=-1;
    tourLbl.textContent='Toca ▶ o un sitio'; }
  document.getElementById('close').addEventListener('click',e=>{e.stopPropagation();closeCard();});

  // ---- Vía Dolorosa: mostrar estación + toggle ----
  function showVia(i,fly){ viaCurrent=i; current=-1; const s=VIA[i];
    hots.forEach(h=>h.classList.remove('active'));
    viaMarks.forEach((m,j)=>m.classList.toggle('active',j===i));
    [...listEl.children].forEach(it=>it.classList.remove('active'));
    card.classList.remove('pass'); card.classList.add('via');
    cNum.textContent=s.n; cName.textContent=s.name; cNote.textContent=s.note||''; cRefs.textContent=s.refs||'';
    card.classList.add('show'); tourLbl.textContent='Estación '+s.n+' / 14 · '+s.name;
    if(fly) flyTo(s,2.8); }
  function toggleVia(){ viaOn=!viaOn; viaG.setAttribute('opacity',viaOn?1:0);
    viaMarks.forEach(m=>m.style.display=viaOn?'':'none');
    document.getElementById('viaToggle').classList.toggle('on',viaOn);
    document.getElementById('tourTitle').textContent = viaOn ? 'Vía Dolorosa' : 'Recorrido de la Pasión';
    if(viaOn){ flyTo(VIA[0],1.7); } else { card.classList.remove('via'); closeCard(); } }
  document.getElementById('viaToggle').addEventListener('click',toggleVia);

  // recorrido paso a paso (Vía Dolorosa si está activa; si no, la Pasión)
  function passStep(d){
    if(viaOn){ const idx = viaCurrent<0 ? (d>0?0:VIA.length-1) : (viaCurrent+d+VIA.length)%VIA.length;
      showVia(idx,true); return; }
    let idx=PASS.findIndex(s=>RAW.indexOf(s)===current);
    idx = idx<0 ? (d>0?0:PASS.length-1) : (idx+d+PASS.length)%PASS.length;
    open(RAW.indexOf(PASS[idx]),true); }
  document.getElementById('next').addEventListener('click',()=>passStep(1));
  document.getElementById('prev').addEventListener('click',()=>passStep(-1));

  document.getElementById('zin').addEventListener('click',()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1.4));
  document.getElementById('zout').addEventListener('click',()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1/1.4));
  document.getElementById('zfit').addEventListener('click',()=>{ scale=minScale; apply(); closeCard(); });

  vp.addEventListener('wheel',e=>{ e.preventDefault(); const r=vp.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12); },{passive:false});
  let drag=null,pts=new Map(),pinch=null;
  vp.addEventListener('pointerdown',e=>{ vp.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){ drag={x:e.clientX,y:e.clientY}; vp.classList.add('grabbing'); }
    else if(pts.size===2){ const a=[...pts.values()]; pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}; drag=null; } });
  vp.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId))return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size===2){ const a=[...pts.values()],nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=vp.getBoundingClientRect();
      zoomAt((a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top,nd/pinch.d); pinch.d=nd; return; }
    if(drag){ tx+=e.clientX-drag.x; ty+=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; apply(); } });
  function up(e){ pts.delete(e.pointerId); if(pts.size<2)pinch=null; if(pts.size===0){ vp.classList.remove('grabbing'); drag=null; } }
  vp.addEventListener('pointerup',up); vp.addEventListener('pointercancel',up);
  vp.addEventListener('click',e=>{ if(e.target===vp||e.target===canvas||e.target===svg) closeCard(); });

  function openDrawer(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
  function closeDrawer(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('menuBtn').addEventListener('click',openDrawer);
  scrim.addEventListener('click',closeDrawer);
  window.addEventListener('resize',apply);

  scale=Math.min(vp.clientWidth/CW,vp.clientHeight/CH); apply();
})();
</script>
</body>
</html>
